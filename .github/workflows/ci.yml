name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm typecheck
      # Before lint: the smoke hosts import the built packages, and typed lint rules
      # resolve `any` for every export until `packages/*/dist` exists.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      # e2e, the perf budgets and the visual baselines stay local. The baselines are
      # captured on darwin (`__screenshots__/*-darwin.png`) and the perf steps are a
      # stopwatch on one machine, so neither is portable to a shared runner.
      # Run `pnpm gate all` locally before a release.
