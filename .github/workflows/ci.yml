name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright's own store, so the cache key below has something to hold.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

jobs:
  gate:
    name: typecheck, lint, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm typecheck
      # Before lint: the smoke hosts import the built packages, and typed lint rules
      # resolve `any` for every export until `packages/*/dist` exists. The build also
      # runs publint, attw and size-limit, so the published shape is checked here.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Resolve the Playwright version
        id: pw
        working-directory: apps/playground
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter playground exec playwright install --with-deps chromium webkit
      - name: Install system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter playground exec playwright install-deps chromium webkit
      - run: pnpm test:e2e
        env:
          # The screenshot baselines are darwin-rasterised, so they are not portable.
          # Everything else in `e2e/` is, and runs here.
          DOCS_E2E_NO_VISUAL: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/playground/playwright-report/
          retention-days: 7

  smoke:
    name: built packages in a host app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Resolve the Playwright version
        id: pw
        working-directory: apps/playground
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter playground exec playwright install --with-deps chromium webkit
      - name: Install system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter playground exec playwright install-deps chromium
      # The hosts consume `dist` through the exports map, so the packages build first.
      - run: pnpm --filter './packages/*' build
      - run: pnpm smoke
