# Two things live outside this file, and the job fails without either:
#
#   1. Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull
#      requests". Without it the version pull request cannot be opened, and the run ends on
#      `GitHub Actions is not permitted to create or approve pull requests`.
#   2. An `NPM_TOKEN` repository secret, granular and scoped to the two packages. Without it
#      the publish step is the one that fails, after the version pull request has landed.
#
# The version pull request's own `ci` run sits at "action required" until a maintainer approves
# it: GitHub does not run workflows on a pull request opened with `GITHUB_TOKEN`, so that no
# workflow can trigger itself. Approve it, or merge on the strength of the run on `main`.
name: release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  # npm provenance: the publish is signed with this run's OIDC token, so the tarball
  # on npm can be traced back to the commit that produced it.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Changesets reads the tags to work out what has already shipped.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm i --frozen-lockfile
      # publint, attw and size-limit run inside this: nothing ships that fails them.
      - run: pnpm build
      # With changesets pending, this opens or updates a "Version packages" pull request.
      # When that pull request lands, the same job publishes what it versioned.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
